<div class="form-container">
  <h2>Solicita tu cotización.</h2>
  <p>Déjanos tus datos y te contactaremos lo antes posible.</p>

  <form (ngSubmit)="enviarFormulario()" #form="ngForm">

    <!-- Nombre -->
    <div class="form-group">
      <label>Nombre completo</label>
      <input
        type="text"
        name="nombre"
        [(ngModel)]="formData.nombre"
        required
        placeholder="Ej: Juan Pérez">
    </div>

    <!-- Teléfono -->
    <div class="form-group">
      <label>Teléfono</label>
      <input
        type="text"
        name="telefono"
        [(ngModel)]="formData.telefono"
        required
        placeholder="Ej: 3001234567">
    </div>



    <!-- Descripción -->



    <!-- Descripción -->
    <div class="form-group">
      <label>Descripción de la obra</label>
      <textarea
        name="descripcion"
        [(ngModel)]="formData.descripcion"
        required
        rows="4"
        placeholder="Cuéntanos brevemente sobre tu proyecto u obra">
  </textarea>
    </div>







    <div class="form-group">
      <label>Correo electrónico (Opcional)</label>
      <input
        type="email"
        name="correo"
        [(ngModel)]="formData.correo"
        placeholder="Ej: correo@email.com">
    </div>



    <!-- Botón -->
    <button type="submit" [disabled]="form.invalid">
      Enviar solicitud
    </button>

  </form>
</div>
