<div class="container mt-5">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Listado de Artículos</h2>

    <!-- BOTÓN CREAR -->
    <a routerLink="/admin/articulos/crear" class="btn btn-primary">
      + Nuevo Artículo
    </a>
  </div>

  <table class="table table-bordered table-hover mt-3">

    <thead class="table-dark">
    <tr>
      <th>ID</th>
      <th>Imagen</th>
      <th>Título</th>
      <th>Categoría</th>
      <th>Autor</th>
      <th>Publicado</th>
      <th>Acciones</th> <!-- ✅ NUEVA COLUMNA -->
    </tr>
    </thead>

    <tbody>

    <tr *ngFor="let art of articulos">

      <td>{{ art.id }}</td>

      <!-- ✅ IMAGEN -->
      <td>

      <td>
        <ng-container *ngIf="art.imagenes && art.imagenes.length > 0; else sinImagen">

          <img
            [src]="getImagen(art.imagenes[0])"
            width="80"
            alt="imagen articulo"
          />

        </ng-container>



      <ng-template #sinImagen>
          <span>No imagen</span>
        </ng-template>
      </td>

      <td>{{ art.titulo }}</td>

      <td>{{ art.categoria }}</td>

      <td>{{ art.autor }}</td>

      <td>
          <span [class]="art.publicada ? 'text-success' : 'text-danger'">
            {{ art.publicada ? 'Sí' : 'No' }}
          </span>
      </td>

      <!-- ✅ ACCIONES -->
      <td>

        <!-- VISTA PREVIA -->
        <a class="btn btn-info btn-sm"
           [routerLink]="['/articulos', getSlugCategoria(art.categoria), art.slug]">
          Ver
        </a>

        <!-- EDITAR -->
        <a class="btn btn-warning btn-sm mx-1"
           [routerLink]="['/admin/articulos/editar', art.id]">
          Editar
        </a>

        <!-- ELIMINAR -->
        <button class="btn btn-danger btn-sm"
                (click)="eliminar(art.id)">
          Eliminar
        </button>

      </td>

    </tr>

    </tbody>

  </table>

</div>
