<div class="container mt-5">
  <h2>Registrar Usuario</h2>

  <form (ngSubmit)="crearUsuario()" #form="ngForm">

    <!-- Nombre -->
    <div class="mb-3">
      <label>Nombre</label>
      <input type="text"
             class="form-control"
             [(ngModel)]="usuario.nombre"
             name="nombre"
             required>
    </div>

    <!-- Apellido -->
    <div class="mb-3">
      <label>Apellido</label>
      <input type="text"
             class="form-control"
             [(ngModel)]="usuario.apellido"
             name="apellido"
             required>
    </div>

    <!-- Email -->
    <div class="mb-3">
      <label>Email</label>
      <input type="email"
             class="form-control"
             [(ngModel)]="usuario.email"
             name="email"
             required>
    </div>

    <!-- Password -->
    <div class="mb-3">
      <label>Password</label>
      <input type="password"
             class="form-control"
             [(ngModel)]="usuario.password"
             name="password"
             required>
    </div>

    <!-- Botón -->
    <button type="submit" class="btn btn-primary">
      Crear Usuario
    </button>

  </form>

  <!-- Mensaje -->
  <div class="mt-3">
    {{ mensaje }}
  </div>
</div>
``
