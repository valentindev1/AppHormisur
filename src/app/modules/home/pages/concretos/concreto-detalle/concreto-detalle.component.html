<div class="main-component-wrapper">
  <ng-container *ngIf="productoActivo as producto">

    <section class="hero-interna position-relative d-flex align-items-center justify-content-center text-center overflow-hidden">
      <div class="position-absolute w-100 h-100 z-0">
        <img [src]="producto.imagenHero" [alt]="producto.titulo" class="w-100 h-100 img-fondo">
      </div>

      <div class="container position-relative z-2 text-white">
        <span class="badge text-uppercase bg-warning text-dark fw-bold px-3 py-2 mb-3 shadow-sm">
          <i class="bi bi-info-circle-fill me-2"></i>Ficha Técnica
        </span>
        <h1 class="display-3 fw-extrabold text-uppercase text-white oswald-font text-shadow-strong">
          {{ producto.titulo }}
        </h1>
        <p class="lead text-light mt-3 mx-auto max-w-600 font-body text-shadow-light">
          {{ producto.subtitulo }}
        </p>
      </div>
    </section>

    <div class="container py-5 mt-4 mb-5">
      <div class="row g-5">
        <div class="col-lg-7">
          <h2 class="text-uppercase mb-3 oswald-font fw-bold text-dark">
            Acerca de <span class="text-warning">este producto</span>
          </h2>
          <div class="section-divider mb-4"></div>

          <p class="fs-5 text-muted font-body mb-4" style="line-height: 1.8;">
            {{ producto.descripcionLarga }}
          </p>


          <div *ngIf="producto.video" class="video-showcase-wrapper mb-5 shadow rounded-4">
            <video
              autoplay
              loop
              [muted]="true"
              playsinline
              class="showcase-video">
              <source [src]="producto.video" type="video/mp4">
            </video>
          </div>


          <div class="d-flex flex-wrap gap-3">
            <a href="https://wa.me/573143616958" target="_blank" class="btn btn-warning fw-bold text-uppercase px-4 py-3 btn-industrial">
              <i class="bi bi-calculator-fill me-2"></i> Cotizar este material
            </a>
          </div>
        </div>

        <div class="col-lg-5">
          <div class="bg-light p-4 rounded-3 shadow-sm mb-4 border-start border-warning border-4">
            <h4 class="text-uppercase fw-bold mb-4 oswald-font text-dark">
              <i class="bi bi-check-circle-fill text-warning me-2"></i> Ventajas Principales
            </h4>
            <ul class="list-unstyled mb-0 font-body">
              <li *ngFor="let ventaja of producto.ventajas" class="mb-3 fs-6 text-muted border-bottom pb-2">
                <i class="bi bi-caret-right-fill text-warning me-2"></i> {{ ventaja }}
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>

  </ng-container>
</div>
