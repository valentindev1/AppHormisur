version: '3.8'

services:

  db:
    image: mysql:8.0
    container_name: hormisur_db
    restart: always

    env_file:
      - .env

    volumes:
      - db_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend/demo
    container_name: hormisur_backend
    restart: always

    env_file:
      - .env

    volumes:
      - backend_uploads:/app/uploads

    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend/frontend-cms
    container_name: hormisur_frontend
    restart: always

    depends_on:
      - backend

  nginx:
    image: nginx:latest
    container_name: hormisur_nginx
    restart: always

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

    depends_on:
      - frontend
      - backend

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  db_data:
  backend_uploads:
