# HTTP → REDIRECCIÓN
server {
    listen 80;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;

    ssl_certificate /etc/letsencrypt/live/hormisursas.com.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hormisursas.com.co/privkey.pem;

    location / {
        proxy_pass http://hormisur_frontend;
    }

    location /api/ {
        proxy_pass http://hormisur_backend:8080;
    }
}
